Domain_Adaptation_training:
  LEARNING_RATE: 0.0002
  BATCH_SIZE: 8
  DEVICE: "cuda"
  NUM_EPOCHS: 30
  IMAGE_HEIGHT: 256
  IMAGE_WIDTH: 256
  PIN_MEMORY: true
  NUM_WORKERS: 0
  LOAD_MODEL: false
  WEIGHT_DECAY: 0.0001
  SEED: 140
dataset:
  root_dir: "D:/work/WBC_Segmentation/WhileBloodCellClassification/data/RawData"
  mask_dir: "Dataset 1"
weight:
  weight_cross_entropy: 1
  weight_mask: 2
  weight_rec: 2
  weight_boundary: 2
class_weights:
  background: 1.0
  cytoplasm: 2.5
  nucleus: 2.0
temperature: 0.6

# Learning Rate Scheduler Configuration
scheduler:
  type: "cosine"  # Options: "cosine", "plateau", null
  T_max: 30       # For cosine annealing
  eta_min: 0.000001
  warmup_epochs: 5

# Early Stopping Configuration
early_stopping:
  patience: 10
  min_delta: 0.001

# Augmentation Configuration
augmentation:
  use_advanced: true
  enabled: true